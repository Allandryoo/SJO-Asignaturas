<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Clicks</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <h1>Contador de Clicks</h1>
        <div class="counter-display">
            <span id="count">0</span>
        </div>
        <button id="click-btn">Haz Click</button>
        <button id="lvlup-btn">Subir de Nivel (x2)</button>
        <button id="lvlup-btn-plus">Subir de Nivel (x4)-1000</button>
        <button id="reset-btn" class="secondary">Reiniciar</button>
    </div>
    <script src="script.js"></script>
</body>

</html>
